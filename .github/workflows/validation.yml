name: Validation

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Validate shell script syntax
        run: |
          bash -n install.sh
          bash -n run.sh
          bash -n docker-xe/scripts/*.sh
          bash -n docker-ords/scripts/*.sh

      - name: Validate version matrix
        run: bash tests/test_version_matrix.sh

      - name: Validate CLI
        run: bash tests/test_rapid_apex_cli.sh

      - name: Validate profile matrix
        run: bash tests/test_profile_matrix.sh

      - name: Validate documentation install workflow
        run: bash tests/test_docs_install_workflow.sh

      - name: Validate skill package
        run: bash tests/test_skill_package.sh

  shellcheck:
    name: ShellCheck modern scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          shellcheck -x --severity=warning \
            bin/rapid-apex \
            lib/rapid-apex-cli.sh \
            tools/version-matrix.sh \
            tests/test_version_matrix.sh \
            tests/test_rapid_apex_cli.sh \
            tests/test_profile_matrix.sh \
            tests/test_docs_install_workflow.sh \
            tests/test_skill_package.sh

  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker-xe/Dockerfile
          failure-threshold: error

      - name: Run Hadolint for ORDS image
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker-ords/Dockerfile
          failure-threshold: error
